[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "blockguard"
version = "0.1.2"
description = "A circuit breaker for undocumented, server-imposed rate limits."
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
authors = [{ name = "Pedro" }]
keywords = ["rate-limit", "circuit-breaker", "backoff", "scraping", "resilience", "ai-agents", "llm", "tool-calling"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Topic :: Internet :: WWW/HTTP",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.entry-points.pytest11]
blockguard = "blockguard.pytest_plugin"

[project.urls]
Homepage = "https://github.com/pdrleite/blockguard"
Source = "https://github.com/pdrleite/blockguard"
Issues = "https://github.com/pdrleite/blockguard/issues"

[tool.setuptools.packages.find]
where = ["src"]
